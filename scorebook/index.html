<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>야구 기록지 주소가 바뀌었어요</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f7;color:#121b2d;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px;text-align:center}
@media (prefers-color-scheme:dark){body{background:#0b1018;color:#e7ecf3}}
main{max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:center}
h1{font-size:20px;margin:0}
p{margin:0;font-size:14.5px;line-height:1.6;opacity:.8}
a{display:inline-block;margin-top:6px;background:#c8303f;color:#fff;text-decoration:none;font-weight:800;padding:13px 20px;border-radius:12px}
</style>
</head>
<body>
<main>
  <h1>야구 기록지 주소가 바뀌었어요</h1>
  <p>새 주소: dragons-baseball.github.io<br>기록을 가지고 새 주소로 이동하는 중이에요. 홈 화면에 예전 아이콘이 있다면 지우고 새 주소에서 다시 설치해 주세요.</p>
  <a id="go" href="https://dragons-baseball.github.io/">새 주소로 가기</a>
</main>
<script>
(function(){
  var NEW='https://dragons-baseball.github.io/',url=NEW,v3=null,v2=null;
  try{v3=localStorage.getItem('youthScorebook.v3');v2=localStorage.getItem('youthScorebook.v2')}catch(e){}
  if(v3||v2){
    try{
      var bytes=new TextEncoder().encode(JSON.stringify({v3:v3,v2:v2})),bin='',CH=0x8000;
      for(var i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
      url=NEW+'#move='+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }catch(e){}
  }
  document.getElementById('go').href=url;
  var done=false;function go(){if(!done){done=true;location.replace(url)}}
  setTimeout(go,1500);
  try{
    Promise.resolve(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations?navigator.serviceWorker.getRegistrations():[])
    .then(function(rs){return Promise.all(rs.filter(function(r){return new URL(r.scope).pathname.indexOf('/scorebook/')===0}).map(function(r){return r.unregister()}))})
    .then(function(){return self.caches?caches.keys():[]})
    .then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('scorebook-')===0}).map(function(k){return caches.delete(k)}))})
    .then(go,go);
  }catch(e){go()}
})();
</script>
</body>
</html>
